server:
  port: ${PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: expenseguard-backend

# Spring Boot Actuator Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ExpenseGuard Security & JWT Configuration
expenseguard:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  receipt:
    storage-path: ${RECEIPT_STORAGE_PATH:./uploads/receipts}
    max-file-size-mb: ${RECEIPT_MAX_SIZE_MB:10}
