server:
  port: ${PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: expenseguard-backend

  # PostgreSQL DataSource Configuration
  # Externalized to environment variables with fallback defaults for local development.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenseguard_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  # Spring Data JPA & Hibernate Configuration
  jpa:
    # Automatically update the database schema based on JPA entity annotations (Development mode)
    hibernate:
      ddl-auto: update

    # Output formatted SQL queries to standard log output for development debugging
    show-sql: true
    
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

# Log Level Configuration
logging:
  level:
    com.expenseguard: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# ExpenseGuard Security & JWT Configuration
expenseguard:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

